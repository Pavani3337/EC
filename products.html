<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ECW - Products</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/home.css">

</head>

<body>


    <!-- NAVBAR -->

    <header class="navbar">

        <div class="container nav-inner">

            <a href="index.html" class="logo">
                E<span>CW</span>
            </a>

            <button class="menu-btn">
                ☰
            </button>

            <nav class="nav-links">

                <a href="index.html">
                    Home
                </a>

                <a href="products.html">
                    Products
                </a>

                <a href="orders.html">
                    Orders
                </a>

                <a href="login.html">
                    Login
                </a>

                <a href="register.html">
                    Register
                </a>

                <a href="cart.html">
                    🛒 Cart
                    (<span class="cart-count">0</span>)
                </a>

            </nav>

        </div>

    </header>


    <!-- PRODUCTS -->

    <main>

        <section class="container page-title">

            <h1>
                All Products
            </h1>

            <p class="muted">
                Find the products you love.
            </p>


            <!-- SEARCH -->

            <div class="search-bar">

                <input
                    type="text"
                    id="search"
                    placeholder="Search products..."
                >


                <select id="category">

                    <option value="">
                        All Categories
                    </option>

                    <option value="Mobiles">
                        Mobiles
                    </option>

                    <option value="Laptops">
                        Laptops
                    </option>

                    <option value="Watches">
                        Watches
                    </option>

                    <option value="Shoes">
                        Shoes
                    </option>

                    <option value="Accessories">
                        Accessories
                    </option>

                </select>

            </div>


            <!-- PRODUCT LIST -->

            <div
                id="productList"
                class="product-grid"
            >

                <!-- Products loaded using JavaScript -->

            </div>

        </section>

    </main>


    <!-- FOOTER -->

    <footer>

        <div class="container">

            <div class="footer-grid">

                <div>

                    <div class="footer-title">
                        ECW
                    </div>

                    <p>
                        Your one-stop shopping destination
                        for quality products.
                    </p>

                </div>


                <div>

                    <div class="footer-title">
                        Quick Links
                    </div>

                    <p>
                        <a href="index.html">
                            Home
                        </a>
                    </p>

                    <p>
                        <a href="orders.html">
                            Orders
                        </a>
                    </p>

                </div>


                <div>

                    <div class="footer-title">
                        Account
                    </div>

                    <p>
                        <a href="login.html">
                            Login
                        </a>
                    </p>

                    <p>
                        <a href="register.html">
                            Register
                        </a>
                    </p>

                </div>

            </div>


            <div class="footer-bottom">

                © 2026 ECW.
                All Rights Reserved.

            </div>

        </div>

    </footer>


    <script src="js/products.js"></script>

</body>

</html>
