<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ECW - Login</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/home.css">

</head>

<body>


    <!-- NAVBAR -->

    <header class="navbar">

        <div class="container nav-inner">

            <a href="index.html" class="logo">
                E<span>CW</span>
            </a>

            <button class="menu-btn">
                ☰
            </button>

            <nav class="nav-links">

                <a href="index.html">
                    Home
                </a>

                <a href="products.html">
                    Products
                </a>

                <a href="orders.html">
                    Orders
                </a>

                <a href="login.html">
                    Login
                </a>

                <a href="register.html">
                    Register
                </a>

                <a href="cart.html">
                    🛒 Cart
                    (<span class="cart-count">0</span>)
                </a>

            </nav>

        </div>

    </header>


    <!-- LOGIN FORM -->

    <main>

        <div class="container">

            <div class="form-box">

                <h2>
                    Welcome Back
                </h2>


                <div
                    id="message"
                    class="message"
                ></div>


                <form id="loginForm">


                    <div class="form-group">

                        <label>
                            Email
                        </label>

                        <input
                            type="email"
                            name="email"
                            placeholder="Enter your email"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Password
                        </label>

                        <input
                            type="password"
                            name="password"
                            placeholder="Enter your password"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="btn"
                    >
                        Login
                    </button>


                </form>


                <p
                    style="text-align:center;margin-top:15px"
                >

                    New user?

                    <a
                        href="register.html"
                        style="color:#2563eb"
                    >
                        Create account
                    </a>

                </p>

            </div>

        </div>

    </main>


    <!-- FOOTER -->

    <footer>

        <div class="container">

            <div class="footer-bottom">

                © 2026 ECW.
                All Rights Reserved.

            </div>

        </div>

    </footer>


    <script src="js/auth.js"></script>

</body>

</html>
